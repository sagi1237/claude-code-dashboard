<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The Airtable token is typed into this page, so it may only be sent to Airtable. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' file: data:; connect-src https://api.airtable.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bakery Shop HR Onboarding</title>
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--brown:#7A4A1E;--espresso:#3E2410;--gold:#C98A2B;--orange:#E08A3C;--cream:#FFF6E5;--teal:#1F6F78;--mint:#D8EEF0;--berry:#B3412F;--line:#EBDDC3;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--espresso);font:500 16px/1.4 Nunito,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(var(--tab) + 110px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top)}
.head{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.head img{height:56px;display:block}.head h1{font-size:20px;font-weight:800;color:var(--brown);line-height:1.1}.head .date{font-size:14px;opacity:.8}
.btn{min-height:56px;min-width:56px;padding:0 18px;border-radius:16px;border:2px solid transparent;font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.9);transform:scale(.98)}
.primary{background:var(--brown);color:#fff}.secondary{background:var(--mint);color:var(--teal);border-color:var(--teal)}.big{min-height:64px;width:100%}
.chips{display:flex;gap:12px;overflow-x:auto;padding:16px 16px 6px;margin:0 -16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-height:56px;padding:0 22px;border-radius:999px;border:2px solid var(--gold);background:#fff;font-size:18px;font-weight:800;color:var(--brown)}
.chip[aria-pressed=true]{background:var(--gold);color:var(--espresso)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:18px;padding:14px;min-width:0}
.kpi:first-child{border-left-color:var(--brown)}.kpi.bad{border-left-color:var(--berry)}
.kpi .l{font-size:14px;font-weight:700;opacity:.8}.kpi .v{font-size:32px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;line-height:1.15}.kpi.bad .v{color:var(--berry)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 2px 0 var(--line);min-width:0}
.card h2{font-size:20px;font-weight:800;color:var(--brown);margin-bottom:12px}
.hire{display:grid;gap:12px}.top{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--espresso);font-weight:800;font-size:18px;display:grid;place-items:center;flex:none}
.top .n{flex:1;min-width:0}.top b{display:block;font-size:18px}.top small{opacity:.75;font-size:14px}
.badge{font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--mint);color:var(--teal)}.warn{background:#FBEAE6;color:var(--berry)}.soon{background:var(--cream);color:var(--brown);border:1px solid var(--gold)}
.bar{height:14px;border-radius:7px;background:var(--cream);overflow:hidden}.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold),var(--orange))}
.pct{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.acts{display:grid;gap:10px}
.task{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;border:0;background:var(--cream);text-align:left;font-weight:700;margin-bottom:8px}
.task .cb{width:28px;height:28px;border-radius:8px;border:3px solid var(--gold);background:#fff;flex:none;display:grid;place-items:center;font-size:18px;color:#fff}
.task[aria-pressed=true] .cb{background:var(--teal);border-color:var(--teal)}.task[aria-pressed=true] .t{text-decoration:line-through;opacity:.6}
.task .t{flex:1;min-width:0}.task small{display:block;font-weight:700;opacity:.7}.task .od{color:var(--berry);font-weight:800}
.stage{display:grid;grid-template-columns:110px 1fr 24px;gap:10px;align-items:center;margin-bottom:12px;font-weight:800;font-size:14px}
.stage .bar{height:18px}.stage .bar i{background:var(--gold)}
.soonrow{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-radius:14px;background:var(--cream);font-weight:800;margin-bottom:8px}
.empty{text-align:center;padding:28px}.empty img{width:160px;max-width:60%}.empty p{font-weight:700;font-size:18px;margin-top:10px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:0;background:var(--orange);color:var(--espresso);font-size:40px;font-weight:800;box-shadow:0 6px 14px rgba(62,36,16,.35);z-index:20}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--gold);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav a{height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--espresso);font-size:12px;font-weight:800;white-space:nowrap}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cand{align-content:start;border:1px solid var(--line);border-radius:16px;padding:14px}
.cand label{display:grid;gap:6px;font-weight:800;font-size:14px}
.contact{display:flex;gap:12px;flex-wrap:wrap}.contact a{flex:1;text-decoration:none}
nav a span{font-size:24px;line-height:1}nav a[aria-current]{color:var(--brown);background:var(--cream);box-shadow:inset 0 4px 0 var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 100px);background:var(--teal);color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}.toast.show{opacity:1}
footer{text-align:center;font-size:13px;opacity:.7;margin-top:24px}
[hidden]{display:none!important}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-weight:800;font-size:14px}.mode .acts2{display:flex;gap:12px;flex-wrap:wrap}
.note{font-weight:700;font-size:14px;margin-bottom:12px}
dialog{width:min(560px,100%);max-width:100%;max-height:92vh;margin:auto auto 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:0;border-radius:24px 24px 0 0;background:var(--cream);color:var(--espresso);overflow-y:auto}
dialog::backdrop{background:rgba(62,36,16,.5)}
dialog h2{font-size:22px;color:var(--brown);margin:0 0 12px}
dialog form{display:grid;gap:12px}
dialog label{display:grid;gap:6px;font-weight:800}
dialog input,dialog select,.cand select{width:100%;min-width:0;min-height:56px;padding:0 14px;border-radius:16px;border:2px solid var(--gold);background:#fff;color:inherit;font:700 18px Nunito,system-ui,sans-serif}
.err{color:var(--berry);font-weight:800}.err:empty{display:none}
.btn:disabled{opacity:.5;cursor:wait}
@media(min-width:600px){dialog{margin:auto;border-radius:24px}}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}.chips{margin:0;padding:16px 0 6px}.chip{flex:0 0 auto}.head h1{font-size:26px}.acts{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.kpis{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap head"><img src="logo.png" alt="The Bakery Shop"><div><h1>HR Onboarding</h1><div class="date" id="today"></div></div></div></header>
<main class="wrap" id="overview">
  <div class="chips" id="chips" role="group" aria-label="Team filter"></div>
  <div class="mode"><span id="mode" role="status"></span><div class="acts2"><button class="btn secondary" id="connect">🔌 Connect to Airtable</button><button class="btn secondary" id="refresh" hidden>↻ Refresh</button><button class="btn secondary" id="disconnect" hidden>Disconnect</button></div></div>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>
<button class="fab" id="fab" aria-label="Add new hire">+</button>
<nav aria-label="Main">
  <a href="#overview" aria-current="page"><span>🏠</span>Overview</a><a href="#hires"><span>🧑‍🍳</span>New Hires</a>
  <a href="#tasks"><span>✅</span>Tasks</a><a href="#team"><span>👥</span>Team</a><a href="#candidates"><span>📝</span>Candidates</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<dialog id="connectDlg" aria-labelledby="connectTitle">
  <h2 id="connectTitle">Connect to Airtable</h2>
  <p class="note">Your token stays in this browser tab and is sent only to Airtable. Use this on your own device.</p>
  <form id="connectForm">
    <label>Base ID or base link<input name="base" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="app…" required></label>
    <label>Airtable token<input type="password" name="token" autocomplete="off" required></label>
    <p class="err" role="alert"></p>
    <button class="btn primary big" type="submit">Connect</button>
    <button class="btn secondary big" type="button" data-close>Cancel</button>
  </form>
</dialog>
<dialog id="candDlg" aria-labelledby="candTitle">
  <h2 id="candTitle">Add Candidate</h2>
  <p class="note" id="candNote"></p>
  <form id="candForm">
    <label>Full name<input name="name" maxlength="80" autocomplete="off" required></label>
    <label>Position<input name="position" maxlength="80" autocomplete="off" required></label>
    <label>Team<select name="team" required><option value="">Choose a team</option><option>Kitchen</option><option>Counter</option><option>Delivery</option><option>Admin</option></select></label>
    <label>Phone (optional)<input type="tel" name="phone" maxlength="30" autocomplete="off"></label>
    <label>Email (optional)<input type="email" name="email" maxlength="120" autocomplete="off"></label>
    <p class="err" role="alert"></p>
    <button class="btn primary big" type="submit">✔ Save Candidate</button>
    <button class="btn secondary big" type="button" data-close>Cancel</button>
  </form>
</dialog>
<dialog id="addDlg" aria-labelledby="addTitle">
  <h2 id="addTitle">Add New Hire</h2>
  <p class="note" id="addNote"></p>
  <form id="addForm">
    <label>Full name<input name="name" maxlength="80" autocomplete="off" required></label>
    <label>Role<input name="role" maxlength="80" autocomplete="off" required></label>
    <label>Team<select name="team" required><option value="">Choose a team</option><option>Kitchen</option><option>Counter</option><option>Delivery</option><option>Admin</option></select></label>
    <label>Start date<input type="date" name="startDate" min="2000-01-01" max="2099-12-31" required></label>
    <p class="err" role="alert"></p>
    <button class="btn primary big" type="submit">✔ Save New Hire</button>
    <button class="btn secondary big" type="button" data-close>Cancel</button>
  </form>
</dialog>
<script>
(function(){
"use strict";
var today=new Date(); today.setHours(0,0,0,0);
function addDays(t,off){var x=new Date(t);x.setDate(x.getDate()+off);return x.getTime()}
function d(off){return addDays(today.getTime(),off)}
var TASKS=[["Sign contract and tax forms",-3],["Food hygiene certificate",-1],["Uniform and apron issued",0],["Kitchen and allergen walkthrough",0],["Shadow a shift with a buddy",2],["Learn the till and card reader",3],["First solo shift",7],["30-day check-in",30]];
// [name, role, team, start offset in days, tasks done count, extra: tasks skipped]
function mockHire(name,role,t,start,doneCount){return{name:name,role:role,team:t,start:start,tasks:TASKS.map(function(x,k){return{n:x[0],due:addDays(start,x[1]),done:k<doneCount}})}}
var H=[["Maya Cohen","Baker's Assistant","Kitchen",-12,6],["Noam Katz","Barista","Counter",-5,3],["Lior Ben-David","Pastry Chef","Kitchen",-20,7],
["Tamar Shalev","Cashier","Counter",-9,4],["Yossi Peretz","Delivery Driver","Delivery",-2,2],["Rina Alon","Shift Manager","Admin",3,2],
["Omer Dahan","Dishwasher","Kitchen",5,1],["Shira Golan","Barista","Counter",10,0]].map(function(h){return mockHire(h[0],h[1],h[2],d(h[3]),h[4])});
var STAGES=["New","Phone Screen","Interview","Trial Shift","Offer","Hired","Rejected"];
// C is null when the connected base has no readable Candidates table.
var C=[["Dana Mizrahi","Baker","Kitchen","New",-1],["Amir Hadad","Barista","Counter","Phone Screen",-3],["Noa Friedman","Pastry Chef","Kitchen","Interview",-6],
["Eli Ben-Haim","Delivery Driver","Delivery","Trial Shift",-9],["Yael Azulay","Cashier","Counter","Offer",-12],["Tom Segal","Office Assistant","Admin","Rejected",-15]]
.map(function(c,i){return{id:"demo"+i,name:c[0],position:c[1],team:c[2],stage:c[3],applied:d(c[4]),phone:"",email:""}});
var demoC=C;
// conn is null in demo mode. When connected it holds {base, token} for this tab only.
var demo=H,conn=null,loaded=false,loadSeq=0,stepCount=0,KEY="hrAirtable";
var team="All",app=document.getElementById("app");
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function ini(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0]}).join("")}
function dstr(t){return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function over(h){return h.tasks.filter(function(t){return!t.done&&t.due<d(0)})}
function pct(h){return h.tasks.length?Math.round(h.tasks.filter(function(t){return t.done}).length/h.tasks.length*100):0}
function status(h){if(h.start>d(0)&&!over(h).length)return["soon","Starting soon"];return over(h).length?["warn","⚠ Needs attention"]:["ok","✔ On track"]}
function stage(h){var p=pct(h);return p>=100?4:p>=63?3:p>=38?2:p>=13?1:0}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function render(){
  if(conn&&!loaded){app.innerHTML='<div class="card empty"><img src="logo.png" alt="The Bakery Shop"><p>Loading your data. If this stays, tap Refresh.</p></div>';return}
  var L=H.filter(function(h){return team==="All"||h.team===team});
  if(!L.length){app.innerHTML='<div class="card empty"><img src="logo.png" alt="The Bakery Shop"><p>No new hires in this team yet.</p></div><div class="grid">'+candidatesCard()+'</div>';return}
  var od=0,prog=0,done=0,days=[];L.forEach(function(h){od+=over(h).length;if(pct(h)<100)prog++;else done++});
  var month=L.filter(function(h){return new Date(h.start).getMonth()===today.getMonth()}).length;
  var html='<section class="kpis" aria-label="Key figures">'+
   k("New Hires This Month",month)+k("In Progress",prog)+k("Overdue Tasks",od,od>0)+k("Avg Days to Complete",conn?"–":"14")+'</section><div class="grid">';
  html+='<section class="card span2" id="hires"><h2>Onboarding pipeline</h2><div class="grid" style="margin-top:0">'+L.map(function(h){
    var s=status(h),i=H.indexOf(h);return'<article class="hire"><div class="top"><div class="av" aria-hidden="true">'+esc(ini(h.name))+'</div><div class="n"><b>'+esc(h.name)+'</b><small>'+esc(h.role)+' · starts '+dstr(h.start)+'</small></div></div>'+
    '<div><span class="badge '+s[0]+'">'+s[1]+'</span></div><div><div class="pct"><span>Progress</span><span>'+pct(h)+'%</span></div><div class="bar" role="progressbar" aria-valuenow="'+pct(h)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct(h)+'%"></i></div></div>'+
    '<div class="acts"><button class="btn primary" data-list="'+i+'">📋 Open Checklist</button><button class="btn secondary" data-nudge="'+i+'">🔔 Send Reminder</button></div></article>'}).join("")+'</div></section>';
  var next=[];L.forEach(function(h){h.tasks.forEach(function(t){if(!t.done&&t.due<=d(3))next.push({h:h,t:t})})});
  next.sort(function(a,b){return a.t.due-b.t.due});
  html+='<section class="card" id="tasks"><h2>Next tasks</h2>'+(next.length?next.slice(0,6).map(function(x){var o=x.t.due<d(0);
    return'<button class="task" aria-pressed="false" data-h="'+H.indexOf(x.h)+'" data-t="'+x.h.tasks.indexOf(x.t)+'"><span class="cb">✔</span><span class="t">'+esc(x.t.n)+'<small>'+esc(x.h.name)+' · '+(o?'<span class="od">⚠ Overdue since '+dstr(x.t.due)+'</span>':'due '+dstr(x.t.due))+'</small></span></button>'}).join(""):'<p class="badge ok">✔ All caught up</p>')+'</section>';
  var soon=L.filter(function(h){return h.start>d(0)&&h.start<=d(14)});
  html+='<section class="card"><h2>Starting soon</h2>'+(soon.length?soon.map(function(h){return'<div class="soonrow"><span>'+esc(h.name)+'</span><span>'+dstr(h.start)+'</span></div>'}).join(""):'<p>Nobody in the next 14 days.</p>')+'</section>';
  var st=[0,0,0,0,0],names=["Offer signed","Paperwork","Training","First shifts","Complete"];L.forEach(function(h){st[stage(h)]++});
  html+='<section class="card" id="team"><h2>Onboarding by stage</h2>'+names.map(function(n,i){return'<div class="stage"><span>'+n+'</span><div class="bar"><i style="width:'+st[i]/L.length*100+'%"></i></div><span>'+st[i]+'</span></div>'}).join("")+'</section>'+candidatesCard()+'</div>';
  app.innerHTML=html;
}
function candidatesCard(){
  var head='<section class="card span2" id="candidates"><h2>Candidates</h2>';
  if(!C)return head+'<p>Could not read the Candidates table. Check that your base has it and that the token can read it.</p></section>';
  var L=C.filter(function(c){return team==="All"||c.team===team}).sort(function(a,b){return(b.applied||0)-(a.applied||0)});
  var counts=STAGES.map(function(s){var n=L.filter(function(c){return c.stage===s}).length;return n?'<span class="badge soon">'+s+': '+n+'</span>':''}).join("");
  return head+'<button class="btn primary big" data-addcand>＋ Add Candidate</button><div class="counts">'+counts+'</div>'+
  (L.length?'<div class="grid">'+L.map(function(c){
    var tel=c.phone.replace(/[^\d+]/g,""),mail=/^[^\s@?&#]+@[^\s@?&#]+\.[^\s@?&#]+$/.test(c.email)?c.email:"";
    var options=(STAGES.indexOf(c.stage)<0?STAGES.concat(c.stage):STAGES).map(function(s){return'<option'+(s===c.stage?' selected':'')+'>'+esc(s)+'</option>'}).join("");
    return'<article class="hire cand"><div class="top"><div class="av" aria-hidden="true">'+esc(ini(c.name))+'</div><div class="n"><b>'+esc(c.name)+'</b><small>'+esc([c.position,c.team,c.applied?"applied "+dstr(c.applied):""].filter(Boolean).join(" · "))+'</small></div></div>'+
    (tel||mail?'<div class="contact">'+(tel?'<a class="btn secondary" href="tel:'+tel+'">📞 Call</a>':'')+(mail?'<a class="btn secondary" href="mailto:'+esc(mail)+'">✉ Email</a>':'')+'</div>':'')+
    '<label>Stage<select data-stage="'+esc(c.id)+'" aria-label="Stage for '+esc(c.name)+'">'+options+'</select></label></article>'}).join("")+'</div>'
  :'<p class="counts">No candidates here yet.</p>')+'</section>';
}
function k(l,v,bad){return'<div class="kpi'+(bad?" bad":"")+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}
var chips=document.getElementById("chips");
chips.innerHTML=["All","Kitchen","Counter","Delivery","Admin"].map(function(t){return'<button class="chip" aria-pressed="'+(t==="All")+'">'+t+'</button>'}).join("");
chips.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;team=b.textContent;chips.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===b)});render()});
function parseDay(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2]).getTime()}
// Airtable
function airtable(c,table,method,body,query){
  return fetch("https://api.airtable.com/v0/"+c.base+"/"+encodeURIComponent(table)+(query||""),{method:method||"GET",cache:"no-store",headers:{authorization:"Bearer "+c.token,"content-type":"application/json"},body:body?JSON.stringify(body):undefined})
  .catch(function(){throw new Error(method?"No answer from Airtable. Check there before trying again.":"Could not reach Airtable. Check your internet connection.")})
  .then(function(r){
    if(r.ok)return r.json();
    var m={401:"Airtable rejected the token.",403:"No access. Check the base ID and the token's permissions.",404:"Not found. Check the base ID and the token's base access.",422:"Airtable refused the data. Check that table and field names are unchanged.",429:"Too many requests. Wait 30 seconds and try again."};
    var err=new Error(m[r.status]||"The database request failed ("+r.status+").");err.status=r.status;throw err});
}
function listAll(c,table,offset,rows){
  return airtable(c,table,null,null,"?pageSize=100"+(offset?"&offset="+encodeURIComponent(offset):"")).then(function(page){
    rows=(rows||[]).concat(page.records);return page.offset?listAll(c,table,page.offset,rows):rows});
}
function day(s){return s?parseDay(String(s).slice(0,10)):d(0)}
function fetchData(c){
  var hires,steps={};
  // One table after another, to stay under Airtable's request limit.
  return listAll(c,"New Hires").then(function(r){hires=r;return listAll(c,"Checklist Template")})
  .then(function(r){r.forEach(function(x){steps[x.id]=x.fields});return listAll(c,"Onboarding Tasks")})
  .then(function(tasks){return listAll(c,"Candidates").then(function(r){return r.filter(function(x){return x.fields["Name"]}).map(toCandidate)})
  // A base without this table still shows the rest of the dashboard.
  .catch(function(err){if(err.status===403||err.status===404)return null;throw err})
  .then(function(candidates){return{candidates:candidates,stepCount:Object.keys(steps).length,hires:hires.filter(function(h){return h.fields["Name"]}).map(function(h){var f=h.fields;
    return{id:h.id,name:String(f["Name"]),role:f["Role"]||"",team:f["Team"]||"",start:day(f["Start Date"]),tasks:tasks.filter(function(t){return(t.fields["Hire"]||[]).indexOf(h.id)>-1}).map(function(t){
      var s=steps[(t.fields["Checklist Step"]||[])[0]]||{};
      return{id:t.id,order:s["Step"]||99,n:s["Task"]||t.fields["Task Name"]||"Task",due:day(t.fields["Due"]||t.fields["Due Date"]),done:!!t.fields["Done"]}}).sort(function(a,b){return a.order-b.order})}})}})});
}
function toCandidate(r){var f=r.fields;return{id:r.id,name:String(f["Name"]),position:f["Position"]||"",team:f["Team"]||"",stage:f["Stage"]||"New",applied:f["Applied Date"]?day(f["Applied Date"]):null,phone:String(f["Phone"]||""),email:String(f["Email"]||"")}}
function apply(data){C=data.candidates;H=data.hires;stepCount=data.stepCount;loaded=true;showMode();render()}
// Only the newest request may update the screen.
function load(){var c=conn,seq=++loadSeq;return fetchData(c).then(function(data){if(c===conn&&seq===loadSeq)apply(data)})}
function showMode(){
  $("mode").textContent=!conn?"Demo data: changes are not saved":loaded?"Live from Airtable · updated "+new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):"Connecting to Airtable…";
  $("connect").hidden=!!conn;$("refresh").hidden=$("disconnect").hidden=!conn;
  $("foot").textContent=conn?"Connected to your Airtable base":"Mock data for demonstration. Changes are not saved.";
}
function disconnect(){conn=null;loaded=false;H=demo;C=demoC;try{sessionStorage.removeItem(KEY)}catch(e){}showMode();render()}
function failed(err){if(err.status===401){disconnect();openDialog("connectDlg",err.message)}else toast(err.message)}

// Dialogs
function openDialog(id,msg){var dlg=$(id);dlg.querySelector("form").reset();dlg.querySelector(".err").textContent=msg||"";dlg.querySelector("[type=submit]").disabled=false;if(!dlg.open)dlg.showModal()}
document.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",function(){b.closest("dialog").close()})});
function onSubmit(formId,handler){
  var form=$(formId);form.addEventListener("submit",function(e){
    e.preventDefault();var btn=form.querySelector("[type=submit]"),err=form.querySelector(".err");if(btn.disabled)return;
    var v={};new FormData(form).forEach(function(x,key){v[key]=x.trim()});btn.disabled=true;err.textContent="";
    handler(v,form.closest("dialog")).catch(function(x){err.textContent=x.message}).then(function(){btn.disabled=false});
  });
}
var attempt=0;
// Closing the dialog cancels a pending attempt and clears the typed token from the page.
function cancelConnect(){attempt++;$("connectForm").reset()}
$("connectDlg").addEventListener("close",cancelConnect); // Esc key
$("connectForm").querySelector("[data-close]").addEventListener("click",cancelConnect);
onSubmit("connectForm",function(v,dlg){
  var base=(v.base.match(/app[A-Za-z0-9]{14}/)||[])[0];
  if(!base)return Promise.reject(new Error("The base ID starts with app and has 17 characters."));
  if(!/^[!-~]+$/.test(v.token))return Promise.reject(new Error("That does not look like a token."));
  var c={base:base,token:v.token},mine=attempt;
  return fetchData(c).then(function(data){
    if(mine!==attempt)return; // cancelled while connecting
    conn=c;loadSeq++;try{sessionStorage.setItem(KEY,JSON.stringify(c))}catch(e){}
    dlg.close();cancelConnect();apply(data);toast("Connected to Airtable");
  });
});
// The Airtable automation creates the checklist tasks a few seconds after the hire is saved.
function awaitTasks(c,id,tries){
  load().then(function(){
    if(c!==conn)return;
    var h=H.filter(function(x){return x.id===id})[0];
    if(h&&h.tasks.length>=stepCount){toast(h.name+": "+h.tasks.length+" tasks created");return}
    if(tries>1)setTimeout(function(){if(c===conn)awaitTasks(c,id,tries-1)},4000);
    else toast("Saved, but tasks are missing. Check the Airtable automation, then tap Refresh.");
  }).catch(failed);
}
onSubmit("addForm",function(v,dlg){
  if(!v.name||!v.role)return Promise.reject(new Error("Enter a name and a role"));
  var c=conn;
  if(!c){H.push(mockHire(v.name,v.role,v.team,parseDay(v.startDate),0));dlg.close();showTeam("All");toast("Added in demo only. Not saved.");return Promise.resolve()}
  return listAll(c,"New Hires").then(function(rows){
    var last=rows.reduce(function(max,r){var m=/^E-(\d+)$/.exec(r.fields["Employee ID"]||"");return m?Math.max(max,+m[1]):max},200);
    return airtable(c,"New Hires","POST",{records:[{fields:{"Name":v.name,"Employee ID":"E-"+(last+1),"Role":v.role,"Team":v.team,"Start Date":v.startDate}}]});
  }).then(function(res){dlg.close();showTeam("All");toast(v.name+" was saved");awaitTasks(c,res.records[0].id,5)})
  .catch(function(err){if(err.status===401){dlg.close();failed(err)}else throw err});
});
$("connect").addEventListener("click",function(){openDialog("connectDlg")});
$("disconnect").addEventListener("click",function(){disconnect();toast("Disconnected")});
$("refresh").addEventListener("click",function(){var b=this;b.disabled=true;load().then(function(){toast("Data refreshed")}).catch(failed).then(function(){b.disabled=false})});
function showTeam(name){team=name;chips.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c.textContent===name)});render()}
function markDone(btn){
  var task=H[+btn.dataset.h].tasks[+btn.dataset.t],c=conn;
  if(!c){task.done=true;toast("Task marked done");render();return}
  btn.disabled=true;
  airtable(c,"Onboarding Tasks","PATCH",{records:[{id:task.id,fields:{"Done":true}}]}).then(function(){
    if(c!==conn)return;
    loadSeq++; // discard older data still on its way
    H.forEach(function(h){h.tasks.forEach(function(t){if(t.id===task.id)t.done=true})});toast("Task marked done");showMode();render();
  }).catch(function(err){btn.disabled=false;failed(err)});
}
// Candidates
function isoDay(t){var x=new Date(t);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
onSubmit("candForm",function(v,dlg){
  if(!v.name||!v.position)return Promise.reject(new Error("Enter a name and a position"));
  var c=conn;
  if(!c){C.push({id:"demo"+C.length,name:v.name,position:v.position,team:v.team,stage:"New",applied:d(0),phone:v.phone,email:v.email});dlg.close();showTeam("All");toast("Added in demo only. Not saved.");return Promise.resolve()}
  var fields={"Name":v.name,"Position":v.position,"Team":v.team,"Stage":"New","Applied Date":isoDay(d(0))};
  if(v.phone)fields["Phone"]=v.phone;
  if(v.email)fields["Email"]=v.email;
  return airtable(c,"Candidates","POST",{records:[{fields:fields}]}).then(function(res){
    dlg.close();if(c!==conn)return;
    loadSeq++;if(C)C.push(toCandidate(res.records[0]));showTeam("All");showMode();toast(v.name+" was saved");
  }).catch(function(err){if(err.status===401){dlg.close();failed(err)}else throw err});
});
function setStage(select){
  var id=select.dataset.stage,value=select.value,c=conn;
  function done(){
    var item=C.filter(function(x){return x.id===id})[0];if(!item)return;
    item.stage=value;render();toast(item.name+": "+value);
    var again=app.querySelector('[data-stage="'+id+'"]');if(again)again.focus();
  }
  if(!c){done();return}
  select.disabled=true;
  airtable(c,"Candidates","PATCH",{records:[{id:id,fields:{"Stage":value}}]}).then(function(){
    if(c!==conn)return;loadSeq++;done();showMode();
  }).catch(function(err){if(c===conn){render();failed(err)}});
}
app.addEventListener("change",function(e){if(e.target.dataset.stage)setStage(e.target)});
app.addEventListener("click",function(e){
  if(e.target.closest("[data-addcand]")){$("candNote").textContent=conn?"This candidate will be saved to your Airtable base.":"Demo mode: the candidate will not be saved. Connect to Airtable to save.";openDialog("candDlg");return}
  var t=e.target.closest(".task");if(t){markDone(t);return}
  var n=e.target.closest("[data-nudge]");if(n){toast("No reminder was sent to "+H[+n.dataset.nudge].name.split(" ")[0]+". Reminders are not built yet.");return}
  var l=e.target.closest("[data-list]");if(l){var h=H[+l.dataset.list];toast(h.name.split(" ")[0]+": "+h.tasks.filter(function(x){return x.done}).length+" of "+h.tasks.length+" tasks done")}
});
$("fab").addEventListener("click",function(){$("addNote").textContent=conn?"This worker will be saved to your Airtable base.":"Demo mode: the worker will not be saved. Connect to Airtable to save.";openDialog("addDlg")});
document.querySelectorAll("nav a").forEach(function(a){a.addEventListener("click",function(){document.querySelectorAll("nav a").forEach(function(x){x.removeAttribute("aria-current")});a.setAttribute("aria-current","page")})});
document.getElementById("today").textContent=today.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
try{conn=JSON.parse(sessionStorage.getItem(KEY))}catch(e){}
if(conn){H=[];C=[];showMode();render();load().catch(failed)}else{showMode();render()}
})();
</script>
</body>
</html>
