<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bakery Shop Sales</title>
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brown: #7A4A1E;
  --espresso: #3E2410;
  --gold: #C98A2B;
  --orange: #E08A3C;
  --cream: #FFF6E5;
  --white: #FFFFFF;
  --teal: #1F6F78;
  --mint: #D8EEF0;
  --berry: #B3412F;
  --line: #EBDDC3;
  --tab-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--cream); color: var(--espresso);
  font: 500 16px/1.4 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-bottom: calc(var(--tab-h) + 110px + env(safe-area-inset-bottom));
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* Header */
header { background: var(--cream); border-bottom: 3px solid var(--gold); padding-top: env(safe-area-inset-top); }
.head { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.head img { height: 56px; width: auto; display: block; }
.head .title { flex: 1; min-width: 0; }
.head h1 { font-size: 20px; font-weight: 800; color: var(--brown); line-height: 1.1; }
.head .date { font-size: 14px; color: var(--espresso); opacity: .8; }

/* Buttons */
.btn {
  min-height: 56px; min-width: 56px; padding: 0 20px; border-radius: 16px; border: 2px solid transparent;
  font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: filter .1s, transform .05s;
}
.btn:active { filter: brightness(.9); transform: scale(.98); }
.btn .ic { font-size: 24px; line-height: 1; }
.btn-primary { background: var(--brown); color: #fff; }
.btn-secondary { background: var(--mint); color: var(--teal); border-color: var(--teal); }
.btn-big { min-height: 64px; width: 100%; }

/* Range chips */
.chips { display: flex; gap: 12px; overflow-x: auto; padding: 16px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 1 0 auto; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--gold);
  background: var(--white); font-size: 18px; font-weight: 800; color: var(--brown);
}
.chip[aria-pressed="true"] { background: var(--gold); color: var(--espresso); }
.chip:active { filter: brightness(.92); }

/* Cards */
main { padding-top: 10px; }
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 2px 0 var(--line); min-width: 0; }
.card h2 { font-size: 20px; font-weight: 800; color: var(--brown); margin-bottom: 12px; }
.card h2 small { font-size: 14px; font-weight: 500; color: var(--espresso); opacity: .75; margin-left: 6px; }

.kpis { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 16px; }
.kpi { background: var(--white); border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: 18px; padding: 14px; min-width: 0; }
.kpi:first-child { border-left-color: var(--brown); }
.kpi .label { font-size: 14px; font-weight: 700; opacity: .8; }
.kpi .value { font-size: 30px; font-weight: 800; color: var(--brown); font-variant-numeric: tabular-nums; line-height: 1.15; margin: 2px 0; overflow-wrap: anywhere; }
.kpi .delta { font-size: 14px; font-weight: 800; }
.up { color: var(--teal); }
.down { color: var(--berry); }
.flat { color: var(--espresso); opacity: .7; }

/* Line chart */
.readout { min-height: 26px; font-weight: 800; color: var(--teal); font-size: 16px; font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { font: 600 11px "Nunito", system-ui, sans-serif; fill: var(--espresso); opacity: .75; }

/* Top sellers */
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rank li { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; }
.rank .n { width: 28px; height: 28px; border-radius: 50%; background: var(--cream); border: 2px solid var(--gold); font-weight: 800; font-size: 14px; display: grid; place-items: center; color: var(--brown); }
.rank .name { font-weight: 800; }
.rank .units { font-weight: 800; color: var(--brown); font-variant-numeric: tabular-nums; }
.rank .bar { grid-column: 2 / 4; height: 12px; border-radius: 6px; background: var(--cream); overflow: hidden; }
.rank .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--orange)); }

/* Donut */
.donut-wrap { display: grid; gap: 12px; justify-items: center; }
.donut { width: 190px; height: 190px; }
.donut text { fill: var(--brown); }
.legend { width: 100%; display: grid; gap: 8px; }
.legend .row { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 14px; background: var(--cream); font-weight: 800; }
.legend .sw { width: 18px; height: 18px; border-radius: 5px; flex: none; }
.legend .nm { flex: 1; }
.legend .amt { font-variant-numeric: tabular-nums; }
.legend .pc { opacity: .7; width: 48px; text-align: right; font-variant-numeric: tabular-nums; }

/* Hours */
.hours { display: flex; align-items: flex-end; gap: 4px; height: 150px; }
.hours .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.hours .b { width: 100%; border-radius: 6px 6px 0 0; background: var(--gold); min-height: 2px; }
.hours .col.peak .b { background: var(--orange); }
.hours .lbl { font-size: 11px; font-weight: 700; margin-top: 4px; opacity: .75; }
.peaknote { margin-top: 10px; font-weight: 800; color: var(--teal); }

/* Low stock */
.stock { border: 3px solid var(--berry); }
.stock h2 { color: var(--berry); }
.stock ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.stock li { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; border-radius: 14px; background: #FBEAE6; font-weight: 800; }
.stock li span:last-child { color: var(--berry); white-space: nowrap; }
.ok { font-weight: 800; color: var(--teal); }

/* Recent sales */
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.recent li { min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--cream); border-radius: 14px; font-weight: 700; }
.recent .t { opacity: .7; font-size: 14px; width: 52px; flex: none; font-variant-numeric: tabular-nums; }
.recent .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .m { font-weight: 800; color: var(--brown); font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 28px 16px; }
.empty img { width: 160px; max-width: 60%; }
.empty p { margin: 12px 0 16px; font-size: 18px; font-weight: 700; }

/* FAB */
.fab {
  position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));
  width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--orange); color: var(--espresso);
  font-size: 40px; font-weight: 800; line-height: 1; box-shadow: 0 6px 14px rgba(62,36,16,.35); z-index: 20;
  display: grid; place-items: center;
}
.fab:active { filter: brightness(.9); transform: scale(.96); }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--white); border-top: 3px solid var(--gold);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  height: var(--tab-h); min-width: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-decoration: none; color: var(--espresso); font-size: 13px; font-weight: 800; gap: 2px;
}
nav.tabs a .ic { font-size: 24px; line-height: 1; }
nav.tabs a[aria-current="page"] { color: var(--brown); background: var(--cream); box-shadow: inset 0 4px 0 var(--gold); }

/* Add sale sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(62,36,16,.5); z-index: 40; display: none; }
.sheet-bg.open { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--cream);
  border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto;
}
.sheet h2 { font-size: 22px; color: var(--brown); font-weight: 800; margin-bottom: 12px; }
.prods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prod { min-height: 64px; border-radius: 16px; border: 2px solid var(--gold); background: var(--white); padding: 8px 10px; font-weight: 800; text-align: left; line-height: 1.2; }
.prod small { display: block; font-weight: 700; opacity: .7; }
.prod[aria-pressed="true"] { background: var(--gold); }
.stepper { display: grid; grid-template-columns: 72px 1fr 72px; gap: 10px; align-items: center; margin: 14px 0; }
.stepper output { text-align: center; font-size: 34px; font-weight: 800; color: var(--brown); }
.stepper .btn { min-height: 64px; font-size: 32px; padding: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.seg .chip { flex: none; }
.sheet .actions { display: grid; gap: 10px; }
.total { text-align: center; font-weight: 800; font-size: 18px; margin-bottom: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 100px); background: var(--teal); color: #fff; padding: 14px 22px; border-radius: 14px; font-weight: 800; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
footer { text-align: center; font-size: 13px; opacity: .7; margin-top: 24px; }

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2 { grid-column: 1 / -1; }
  .head img { height: 64px; }
  .head h1 { font-size: 26px; }
  .chips { margin: 0; padding: 16px 0 6px; }
  .chip { flex: 0 0 auto; }
}
@media (min-width: 1024px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .kpi .value { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <img src="logo.png" alt="The Bakery Shop">
    <div class="title">
      <h1>Sales Dashboard</h1>
      <div class="date" id="today"></div>
    </div>
  </div>
</header>

<main class="wrap" id="dashboard">
  <div class="chips" role="group" aria-label="Date range" id="ranges">
    <button class="chip" data-days="1" aria-pressed="true">Today</button>
    <button class="chip" data-days="7" aria-pressed="false">7 Days</button>
    <button class="chip" data-days="30" aria-pressed="false">30 Days</button>
    <button class="chip" data-days="90" aria-pressed="false">90 Days</button>
  </div>

  <div id="app"></div>
  <footer>Sample data for demonstration</footer>
</main>

<button class="fab" id="fab" aria-label="Add sale">+</button>

<nav class="tabs" aria-label="Main">
  <a href="#dashboard" aria-current="page"><span class="ic">🏠</span>Dashboard</a>
  <a href="#sales"><span class="ic">🧾</span>Sales</a>
  <a href="#products"><span class="ic">🥐</span>Products</a>
  <a href="#reports"><span class="ic">📊</span>Reports</a>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Add sale">
    <h2>Add Sale</h2>
    <div class="prods" id="prods"></div>
    <div class="stepper">
      <button class="btn btn-secondary" id="minus" aria-label="Fewer">−</button>
      <output id="qty">1</output>
      <button class="btn btn-secondary" id="plus" aria-label="More">+</button>
    </div>
    <div class="seg" id="pay">
      <button class="chip" data-pay="card" aria-pressed="true">💳 Card</button>
      <button class="chip" data-pay="cash" aria-pressed="false">💵 Cash</button>
    </div>
    <div class="total" id="sheetTotal"></div>
    <div class="actions">
      <button class="btn btn-primary btn-big" id="save"><span class="ic">✔</span>Save Sale</button>
      <button class="btn btn-secondary btn-big" id="cancel">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ---------- Sample data (seeded so it looks the same on every load) ---------- */
  var PRODUCTS = [
    { name: "Butter Croissant",   cat: "Pastries", price: 3.20, pop: 10, par: 120 },
    { name: "Sourdough Loaf",     cat: "Breads",   price: 7.50, pop: 6,  par: 40 },
    { name: "Baguette",           cat: "Breads",   price: 3.80, pop: 8,  par: 70 },
    { name: "Blueberry Muffin",   cat: "Pastries", price: 3.40, pop: 7,  par: 60 },
    { name: "Cinnamon Roll",      cat: "Pastries", price: 4.00, pop: 7,  par: 60 },
    { name: "Chocolate Cake Slice", cat: "Cakes",  price: 5.50, pop: 4,  par: 40 },
    { name: "Cheesecake Slice",   cat: "Cakes",    price: 5.80, pop: 3,  par: 30 },
    { name: "Latte",              cat: "Drinks",   price: 4.20, pop: 8,  par: 150 },
    { name: "Drip Coffee",        cat: "Drinks",   price: 2.80, pop: 7,  par: 150 }
  ];
  var CATS = [
    { name: "Breads",   color: "#7A4A1E" },
    { name: "Pastries", color: "#C98A2B" },
    { name: "Cakes",    color: "#E08A3C" },
    { name: "Drinks",   color: "#1F6F78" }
  ];
  var OPEN = 6, CLOSE = 18;            // hours shown: 6am .. 6pm
  var HOUR_W = [3, 9, 6, 4, 3, 5, 7, 6, 4, 3, 3, 2, 1]; // hourly traffic weights for 6..18
  var DAY = 86400000;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pick(weights, r) {
    var sum = 0, i;
    for (i = 0; i < weights.length; i++) sum += weights[i];
    var x = r() * sum;
    for (i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; }
    return weights.length - 1;
  }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); }

  var now = new Date();
  var todayStart = startOfDay(now);
  var records = [], orderSeq = 1000;
  (function generate() {
    var r = rng(2022);
    var prodW = PRODUCTS.map(function (p) { return p.pop; });
    for (var back = 190; back >= 0; back--) {
      var dayStart = todayStart - back * DAY;
      var dow = new Date(dayStart).getDay();
      var orders = Math.round(78 + (dow === 0 || dow === 6 ? 32 : 0) + (dow === 5 ? 12 : 0) + r() * 22 + (190 - back) * 0.04);
      for (var o = 0; o < orders; o++) {
        var h = OPEN + pick(HOUR_W, r), m = Math.floor(r() * 60);
        var t = dayStart + h * 3600000 + m * 60000;
        if (t > now.getTime()) continue;
        var id = "S-" + (++orderSeq), lines = 1 + pick([6, 3, 1], r), pay = r() < 0.7 ? "card" : "cash";
        for (var l = 0; l < lines; l++) {
          var p = PRODUCTS[pick(prodW, r)];
          records.push({ id: id, t: t, product: p.name, cat: p.cat, qty: 1 + (r() < 0.25 ? 1 : 0), price: p.price, pay: pay });
        }
      }
    }
  })();

  /* ---------- Helpers ---------- */
  var money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  var money0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  var num = new Intl.NumberFormat("en-US");
  function $(s, c) { return (c || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function hourLabel(h) { return (h % 12 || 12) + (h < 12 ? "a" : "p"); }
  function rev(rs) { var s = 0; rs.forEach(function (x) { s += x.qty * x.price; }); return s; }
  function orderCount(rs) { var ids = {}; rs.forEach(function (x) { ids[x.id] = 1; }); return Object.keys(ids).length; }
  function items(rs) { var s = 0; rs.forEach(function (x) { s += x.qty; }); return s; }
  function between(a, b) { return records.filter(function (x) { return x.t >= a && x.t < b; }); }

  function windowFor(days) {
    var start = todayStart - (days - 1) * DAY, end = now.getTime() + 1;
    var pStart = start - days * DAY, pEnd = days === 1 ? now.getTime() - DAY + 1 : start;
    return { cur: between(start, end), prev: between(pStart, pEnd), start: start };
  }

  function delta(cur, prev) {
    if (!prev) return { cls: "flat", txt: "no prior data" };
    var p = (cur - prev) / prev * 100;
    if (Math.abs(p) < 0.05) return { cls: "flat", txt: "— 0.0%" };
    return p > 0 ? { cls: "up", txt: "▲ +" + p.toFixed(1) + "%" } : { cls: "down", txt: "▼ −" + Math.abs(p).toFixed(1) + "%" };
  }

  /* ---------- Rendering ---------- */
  var state = { days: 1 };
  var app = $("#app");

  function kpi(label, value, d) {
    return '<div class="kpi"><div class="label">' + label + '</div><div class="value">' + value +
      '</div><div class="delta ' + d.cls + '">' + d.txt + ' <span class="sr">vs previous period</span></div></div>';
  }

  function lineChart(series, labels, fmtTip) {
    var W = 340, H = 200, L = 44, R = 10, T = 12, B = 26;
    var vals = series.map(function (v) { return v == null ? 0 : v; });
    var max = Math.max.apply(null, vals.concat([1]));
    var step = Math.pow(10, Math.floor(Math.log(max) / Math.LN10)); var top = Math.ceil(max / step) * step;
    if (top / step < 2) top = step * 2;
    var n = series.length, iw = W - L - R, ih = H - T - B;
    function x(i) { return L + (n === 1 ? iw / 2 : i * iw / (n - 1)); }
    function y(v) { return T + ih - v / top * ih; }
    var last = n - 1; while (last > 0 && series[last] == null) last--;
    var pts = [], i;
    for (i = 0; i <= last; i++) pts.push(x(i).toFixed(1) + "," + y(vals[i]).toFixed(1));
    var grid = "";
    for (i = 0; i <= 4; i++) {
      var gv = top * i / 4, gy = y(gv);
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="#EBDDC3"/>' +
        '<text x="' + (L - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + money0.format(gv) + '</text>';
    }
    var xl = "", every = Math.ceil(n / 6);
    for (i = 0; i < n; i += every) xl += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + labels[i] + '</text>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sales over time chart" data-n="' + n + '" data-l="' + L + '" data-r="' + R + '" data-w="' + W + '">' +
      grid + xl +
      '<polygon points="' + x(0) + ',' + y(0) + ' ' + pts.join(" ") + ' ' + x(last) + ',' + y(0) + '" fill="#C98A2B" fill-opacity=".18"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#C98A2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line id="cl" y1="' + T + '" y2="' + (H - B) + '" stroke="#1F6F78" stroke-width="2" visibility="hidden"/>' +
      '<circle id="cd" r="6" fill="#1F6F78" stroke="#fff" stroke-width="2" visibility="hidden"/>' +
      '</svg>';
  }

  function render() {
    var w = windowFor(state.days), cur = w.cur, prev = w.prev;
    var total = rev(cur), pTotal = rev(prev);
    var ord = orderCount(cur), pOrd = orderCount(prev);
    var aov = ord ? total / ord : 0, pAov = pOrd ? pTotal / pOrd : 0;
    var it = items(cur), pIt = items(prev);

    if (!cur.length) {
      app.innerHTML = '<div class="card empty"><img src="logo.png" alt="The Bakery Shop"><p>No sales yet today. Tap + Add Sale to start.</p>' +
        '<button class="btn btn-primary btn-big" data-open><span class="ic">+</span>Add Sale</button></div>';
      return;
    }

    var html = '<section class="kpis" aria-label="Key figures">' +
      kpi("Total Sales", money.format(total), delta(total, pTotal)) +
      kpi("Orders", num.format(ord), delta(ord, pOrd)) +
      kpi("Avg Order", money.format(aov), delta(aov, pAov)) +
      kpi("Items Sold", num.format(it), delta(it, pIt)) + '</section>';

    // series
    var series = [], labels = [], tipFmt = [], i;
    if (state.days === 1) {
      for (i = OPEN; i <= CLOSE; i++) {
        labels.push(hourLabel(i));
        tipFmt.push(hourLabel(i));
        series.push(i > now.getHours() ? null : 0);
      }
      cur.forEach(function (x) { var h = new Date(x.t).getHours(); if (h >= OPEN && h <= CLOSE) series[h - OPEN] += x.qty * x.price; });
    } else {
      for (i = 0; i < state.days; i++) {
        var d = new Date(w.start + i * DAY);
        labels.push((d.getMonth() + 1) + "/" + d.getDate());
        tipFmt.push(d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }));
        series.push(0);
      }
      cur.forEach(function (x) { series[Math.floor((startOfDay(x.t) - w.start) / DAY)] += x.qty * x.price; });
    }

    // top sellers
    var byProd = {};
    cur.forEach(function (x) { byProd[x.product] = (byProd[x.product] || 0) + x.qty; });
    var top = Object.keys(byProd).map(function (k) { return [k, byProd[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
    var topMax = top[0][1];
    var rank = '<ol class="rank">' + top.map(function (t, k) {
      return '<li><span class="n">' + (k + 1) + '</span><span class="name">' + esc(t[0]) + '</span><span class="units">' + num.format(t[1]) +
        '</span><span class="bar"><i style="width:' + (t[1] / topMax * 100).toFixed(0) + '%"></i></span></li>';
    }).join("") + '</ol>';

    // categories donut
    var byCat = {};
    cur.forEach(function (x) { byCat[x.cat] = (byCat[x.cat] || 0) + x.qty * x.price; });
    var R0 = 70, C = 2 * Math.PI * R0, off = 0;
    var rings = CATS.map(function (c) {
      var v = byCat[c.name] || 0, len = v / total * C;
      var s = '<circle cx="95" cy="95" r="' + R0 + '" fill="none" stroke="' + c.color + '" stroke-width="30" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 95 95)"/>';
      off += len; return s;
    }).join("");
    var donut = '<div class="donut-wrap"><svg class="donut" viewBox="0 0 190 190" role="img" aria-label="Sales by category">' + rings +
      '<text x="95" y="92" text-anchor="middle" font-size="13" font-weight="700">Total</text>' +
      '<text x="95" y="114" text-anchor="middle" font-size="20" font-weight="800">' + money0.format(total) + '</text></svg><div class="legend">' +
      CATS.map(function (c) {
        var v = byCat[c.name] || 0;
        return '<div class="row"><span class="sw" style="background:' + c.color + '"></span><span class="nm">' + c.name + '</span><span class="amt">' +
          money0.format(v) + '</span><span class="pc">' + (v / total * 100).toFixed(0) + '%</span></div>';
      }).join("") + '</div></div>';

    // hourly
    var hrs = []; for (i = OPEN; i <= CLOSE; i++) hrs.push(0);
    cur.forEach(function (x) { var h = new Date(x.t).getHours(); if (h >= OPEN && h <= CLOSE) hrs[h - OPEN] += x.qty * x.price; });
    var hMax = Math.max.apply(null, hrs), peak = hrs.indexOf(hMax);
    var hours = '<div class="hours" role="img" aria-label="Sales by hour">' + hrs.map(function (v, k) {
      return '<div class="col' + (k === peak ? " peak" : "") + '"><div class="b" style="height:' + (hMax ? v / hMax * 100 : 0).toFixed(0) + '%"></div>' +
        (k % 2 === 0 ? '<div class="lbl">' + hourLabel(OPEN + k) + '</div>' : '<div class="lbl">&nbsp;</div>') + '</div>';
    }).join("") + '</div><p class="peaknote">Busiest hour: ' + hourLabel(OPEN + peak) + ' (' + money0.format(hMax) + ')</p>';

    // low stock (based on today's sales vs. daily par level)
    var soldToday = {};
    records.forEach(function (x) { if (x.t >= todayStart) soldToday[x.product] = (soldToday[x.product] || 0) + x.qty; });
    var low = PRODUCTS.map(function (p) { return { name: p.name, left: Math.max(0, Math.round(p.par * 0.55) - (soldToday[p.name] || 0)), par: Math.round(p.par * 0.55) }; })
      .filter(function (p) { return p.left / p.par <= 0.3; }).sort(function (a, b) { return a.left - b.left; });
    var stock = low.length
      ? '<ul>' + low.map(function (p) { return '<li><span>' + esc(p.name) + '</span><span>' + (p.left === 0 ? "Sold out" : p.left + " left") + '</span></li>'; }).join("") + '</ul>'
      : '<p class="ok">✔ Everything is well stocked.</p>';

    // recent sales
    var recent = {}, order = [];
    records.slice(-60).reverse().forEach(function (x) {
      if (!recent[x.id]) { recent[x.id] = { t: x.t, lines: [], sum: 0 }; order.push(x.id); }
      recent[x.id].lines.push(x.qty + "× " + x.product); recent[x.id].sum += x.qty * x.price;
    });
    var recentHtml = '<ul class="recent">' + order.slice(0, 6).map(function (id) {
      var r = recent[id], d = new Date(r.t);
      return '<li><span class="t">' + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + '</span><span class="p">' + esc(r.lines.join(", ")) +
        '</span><span class="m">' + money.format(r.sum) + '</span></li>';
    }).join("") + '</ul>';

    html += '<div class="grid">' +
      '<section class="card span2" id="reports"><h2>Sales over time<small>' + (state.days === 1 ? "by hour" : "by day") + '</small></h2><div class="readout" id="readout" aria-live="polite">Touch the chart for details</div>' +
        lineChart(series, labels) + '</section>' +
      '<section class="card" id="products"><h2>Top sellers<small>units</small></h2>' + rank + '</section>' +
      '<section class="card"><h2>Sales by category</h2>' + donut + '</section>' +
      '<section class="card"><h2>Busiest hours</h2>' + hours + '</section>' +
      '<section class="card stock"><h2>⚠ Low stock today</h2>' + stock + '</section>' +
      '<section class="card span2" id="sales"><h2>Recent sales</h2>' + recentHtml + '</section>' +
      '</div>';
    app.innerHTML = html;

    // chart interaction
    var svg = $("svg.chart", app);
    if (svg) {
      var n = series.length, L = 44, R = 10, W = 340, H = 200, T = 12, B = 26, ih = H - T - B;
      var mx = Math.max.apply(null, series.map(function (v) { return v || 0; }).concat([1]));
      var step = Math.pow(10, Math.floor(Math.log(mx) / Math.LN10)), topv = Math.ceil(mx / step) * step; if (topv / step < 2) topv = step * 2;
      var show = function (e) {
        var rc = svg.getBoundingClientRect(), px = (e.clientX - rc.left) / rc.width * W;
        var idx = Math.round((px - L) / (W - L - R) * (n - 1)); idx = Math.max(0, Math.min(n - 1, idx));
        if (series[idx] == null) return;
        var cx = L + (n === 1 ? (W - L - R) / 2 : idx * (W - L - R) / (n - 1)), cy = T + ih - series[idx] / topv * ih;
        var cl = $("#cl", svg), cd = $("#cd", svg);
        cl.setAttribute("x1", cx); cl.setAttribute("x2", cx); cl.setAttribute("visibility", "visible");
        cd.setAttribute("cx", cx); cd.setAttribute("cy", cy); cd.setAttribute("visibility", "visible");
        $("#readout").textContent = tipFmt[idx] + ": " + money.format(series[idx]);
      };
      svg.addEventListener("pointerdown", show);
      svg.addEventListener("pointermove", show);
    }
  }

  /* ---------- Controls ---------- */
  $("#today").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  $("#ranges").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.days = +b.dataset.days;
    document.querySelectorAll("#ranges .chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    render();
  });

  document.querySelectorAll('nav.tabs a').forEach(function (a) {
    a.addEventListener("click", function () {
      document.querySelectorAll("nav.tabs a").forEach(function (x) { x.removeAttribute("aria-current"); });
      a.setAttribute("aria-current", "page");
    });
  });

  // Add sale sheet
  var sheetBg = $("#sheetBg"), sel = null, qty = 1, pay = "card";
  var prods = $("#prods");
  prods.innerHTML = PRODUCTS.map(function (p, i) {
    return '<button class="prod" data-i="' + i + '" aria-pressed="false">' + esc(p.name) + '<small>' + money.format(p.price) + '</small></button>';
  }).join("");
  function sheetUpdate() {
    $("#qty").textContent = qty;
    $("#sheetTotal").textContent = sel == null ? "Choose an item" : "Total " + money.format(PRODUCTS[sel].price * qty);
    $("#save").disabled = sel == null; $("#save").style.opacity = sel == null ? .5 : 1;
  }
  function openSheet() { sel = null; qty = 1; pay = "card"; prods.querySelectorAll(".prod").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    document.querySelectorAll("#pay .chip").forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.pay === "card" ? "true" : "false"); });
    sheetUpdate(); sheetBg.classList.add("open"); }
  function closeSheet() { sheetBg.classList.remove("open"); }
  $("#fab").addEventListener("click", openSheet);
  document.addEventListener("click", function (e) { if (e.target.closest("[data-open]")) openSheet(); });
  $("#cancel").addEventListener("click", closeSheet);
  sheetBg.addEventListener("click", function (e) { if (e.target === sheetBg) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  prods.addEventListener("click", function (e) {
    var b = e.target.closest(".prod"); if (!b) return; sel = +b.dataset.i;
    prods.querySelectorAll(".prod").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); sheetUpdate();
  });
  $("#minus").addEventListener("click", function () { qty = Math.max(1, qty - 1); sheetUpdate(); });
  $("#plus").addEventListener("click", function () { qty = Math.min(99, qty + 1); sheetUpdate(); });
  $("#pay").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return; pay = b.dataset.pay;
    document.querySelectorAll("#pay .chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
  });
  $("#save").addEventListener("click", function () {
    if (sel == null) return;
    var p = PRODUCTS[sel];
    records.push({ id: "S-" + (++orderSeq), t: Date.now(), product: p.name, cat: p.cat, qty: qty, price: p.price, pay: pay });
    now = new Date(); closeSheet(); render();
    var t = $("#toast"); t.textContent = "Saved: " + qty + "× " + p.name; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  });

  render();
})();
</script>
</body>
</html>
